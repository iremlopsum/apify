name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository — it publishes nothing and opens no
# issues or comments. Pinning the token down to that is the default-deny
# posture GitHub recommends for third-party actions.
permissions:
  contents: read

# Superseded runs for the same branch or PR are wasted CI minutes: only the
# newest push can still be merged. Keyed on the ref so main and each PR queue
# independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run test:integration
      - run: npm run build
